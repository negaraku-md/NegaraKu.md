name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Analytics snapshots are committed by their own scheduled workflows (the
    # Visitors accumulate + the Facebook/Search archive); a change to one alone
    # must not trigger a full site rebuild — each refreshes on the next real
    # deploy, which tops it up. The Facebook campaign crons likewise commit their
    # sent-manifest (campaigns/**/.sent.json) — campaign copy is never built into
    # the site, so campaigns/** never needs a rebuild either.
    paths-ignore:
      - 'analytics/**'
      - 'campaigns/**'
  workflow_dispatch:
    inputs:
      maintenance:
        description: 'Maintenance mode — show the maintenance screen on EVERY page. Turn off and re-run to restore the live site.'
        type: boolean
        default: false
      maintenance_until:
        description: 'Optional "expected back by" time, ISO (e.g. 2026-08-21T09:00). Blank = no time shown.'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history (not the default shallow depth:1) so build-changelog.mjs can
        # read the real commit log — otherwise the deployed /changelog shows 1 entry.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Cache the CJK/Liberation .deb packages so the heavy fonts-noto-cjk
      # download (the thing that was timing this step out on slow apt mirrors)
      # happens ONCE, then restores instantly on every later run. Bump the key
      # suffix to force a refetch.
      - name: Cache OG system-font packages (.deb)
        uses: actions/cache@v5
        with:
          path: ~/og-fonts-deb
          key: og-fonts-deb-noto-cjk-liberation-tamil-v2

      - name: Install fonts for Open Graph images
        # BEST-EFFORT — OG social-card fonts must never block the site deploy
        # (continue-on-error + a hard 5-min bound; sharp renders the cards even
        # if a font is missing, it just degrades them). Two sources:
        #   • Brand fonts (Montserrat/Lato) are VENDORED in assets/og-fonts and
        #     registered straight into fontconfig — deterministic, zero network,
        #     and the OG cards now use real brand type instead of a fallback.
        #   • CJK + Liberation (system, for zh cards) install from the cached
        #     .deb if present (offline), else download once and populate the
        #     cache. A stalled mirror on the first run only degrades cards.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Brand fonts — offline, always available
          mkdir -p ~/.fonts
          cp assets/og-fonts/*.ttf ~/.fonts/
          # System CJK + Liberation — from cache if we have it, else fetch once
          mkdir -p ~/og-fonts-deb
          if ls ~/og-fonts-deb/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/og-fonts-deb/*.deb || sudo apt-get -f install -y --no-install-recommends || true
          else
            for i in 1 2 3; do
              sudo apt-get update && \
              sudo apt-get install -y --no-install-recommends --download-only fonts-noto-cjk fonts-liberation fonts-noto-core && break
              echo "apt attempt $i failed; retrying in 5s"; sleep 5
            done
            cp /var/cache/apt/archives/*.deb ~/og-fonts-deb/ 2>/dev/null || true
            sudo dpkg -i ~/og-fonts-deb/*.deb 2>/dev/null || sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-liberation fonts-noto-core || true
          fi
          fc-cache -f >/dev/null 2>&1 || true
          echo "== OG fonts visible to fontconfig =="
          fc-list | grep -iE "montserrat|lato|noto sans cjk|noto sans tamil|noto sans devanagari|noto naskh arabic|liberation" | sort | head -30 || true

      # Restore the per-article Open Graph PNGs so build-og only regenerates the
      # cards whose content actually changed (see scripts/build-og.mjs). The key
      # is bumped automatically when the renderer or logo changes, forcing a full
      # rebuild; otherwise the most recent cache is restored and topped up.
      - name: Cache Open Graph images
        uses: actions/cache@v5
        with:
          path: public/og
          key: og-${{ hashFiles('scripts/build-og.mjs', 'scripts/logo-flower.mjs') }}-${{ github.sha }}
          restore-keys: |
            og-${{ hashFiles('scripts/build-og.mjs', 'scripts/logo-flower.mjs') }}-

      - name: Content health check
        run: |
          npm run sync
          python3 scripts/health/scan.py --strict

      # Add swap so the astro static build survives its peak RSS. At 11 languages
      # the build is squeezed between two walls on the 16 GB runner: an 8 GB V8
      # heap fits the live working set but peak RSS crosses 16 GB (OS OOM-kill,
      # "The operation was canceled"), while a 6 GB heap stays under RAM but is
      # too small for the live set (V8 "heap out of memory"). A big swapfile on
      # the roomy /mnt disk gives the OS headroom to absorb the peak instead of
      # killing the build; the heap stays at 8 GB (NODE_OPTIONS in the Build step).
      # Slower under pressure, but it completes — and it scales to es/fr without
      # re-tuning the heap each time.
      - name: Add swap space
        run: |
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "== memory + swap ==" && free -h

      - name: Build (sync + graph + astro + pagefind)
        env:
          # Raise Node's heap: astro build renders every locale's pages (8k+ with
          # ms/en/zh/ta/ja) and OOMs at the default old-space. 6 GB stays under the
          # GitHub runner's 7 GB RAM (avoid the OS OOM-killer) with room to spare.
          NODE_OPTIONS: --max-old-space-size=6144
          # Visitors analytics — build-analytics.mjs reads these to pull counts
          # from Analytics Engine. Absent → it no-ops ("not tracked yet").
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Cloudflare zone traffic snapshot — pull-cf-traffic.mjs reads the zone's
          # GraphQL HTTP analytics (needs CF_ZONE_ID + a token with Zone
          # Analytics:Read). Absent/unscoped → it writes an empty stub and the
          # "Traffic explorer" shows a connect note. Fail-safe; never breaks build.
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          SITE_URL: https://negaraku.md
          # OG card host. Empty (default) → cards ship in the Pages artifact at
          # same-origin /og/*. Set the repo VARIABLE `OG_BASE_URL` (e.g.
          # https://og.negaraku.md) to serve them from Cloudflare R2 instead —
          # the "Offload OG cards to R2" step below then syncs public/og to R2
          # and strips dist/og from the artifact. Reversible: clear the var.
          OG_BASE_URL: ${{ vars.OG_BASE_URL }}
          # Full-corpus llms-full.txt host. Empty (default) → the 14 per-language
          # dumps (~301 MB) ship same-origin in the Pages artifact. Set the repo
          # VARIABLE `LLMS_FULL_BASE_URL` (e.g. https://og.negaraku.md/_llms) to
          # serve them from R2 instead — the "Offload llms-full.txt to R2" step
          # below then syncs them to the bucket under _llms/ and strips them from
          # the artifact. Reversible: clear the var. (The per-article .md endpoint
          # stays same-origin — its contract is "append .md to any article URL".)
          LLMS_FULL_BASE_URL: ${{ vars.LLMS_FULL_BASE_URL }}
          # Pagefind search-bundle host. Empty (default) → the ~188 MB search
          # index (≈27k incompressible .pf_fragment/.pf_index shards) ships
          # same-origin in the Pages artifact at /pagefind/*. Set the repo
          # VARIABLE `PAGEFIND_BASE_URL` (e.g. https://og.negaraku.md/_pagefind)
          # to serve the bundle from R2 instead — the "Offload pagefind to R2"
          # step below syncs dist/pagefind to the bucket under _pagefind/ and
          # strips it from the artifact. Reversible: clear the var. NOTE: unlike
          # OG/llms this is fetched cross-origin, so the bucket needs a GET CORS
          # policy for the site origin (the offload step asserts one).
          PAGEFIND_BASE_URL: ${{ vars.PAGEFIND_BASE_URL }}
          # Maintenance mode — only ever on via a manual "Run workflow" with the
          # toggle. A normal push (inputs empty) always deploys the live site.
          MAINTENANCE: ${{ github.event.inputs.maintenance == 'true' && '1' || '' }}
          MAINTENANCE_UNTIL: ${{ github.event.inputs.maintenance_until }}
        run: npm run build

      # When OG_BASE_URL is set, the 823 MB of OG cards (≈28k PNG + WebP files)
      # live on Cloudflare R2, not in the Pages artifact. Sync public/og to the
      # bucket (incremental, size-only) with correct content-types, then delete
      # dist/og so the uploaded artifact shrinks by ~823 MB. aws-cli ships on the
      # runner; R2 speaks the S3 API. If the var is set but the R2 secrets are
      # missing we FAIL — never ship HTML/og:image pointing at an empty bucket.
      - name: Offload OG cards to R2
        if: ${{ vars.OG_BASE_URL != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # aws-cli v2 (>=2.23) adds default CRC integrity checksums that R2's
          # S3 API rejects ("header 'x-amz-checksum-crc32'…"). Force the legacy
          # behaviour so `aws s3 sync` works against R2.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::OG_BASE_URL is set but R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET are not all present. Refusing to ship HTML that points at an unpopulated bucket."
            exit 1
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "== OG before offload =="; du -sh public/og || true
          # PNG share cards (og:image) — content-type image/png.
          aws s3 sync public/og "s3://${R2_BUCKET}/" --endpoint-url "$EP" \
            --size-only --no-progress --only-show-errors \
            --exclude "*" --include "*.png" \
            --content-type image/png \
            --cache-control "public, max-age=31536000, immutable"
          # WebP on-page thumbnails — content-type image/webp.
          aws s3 sync public/og "s3://${R2_BUCKET}/" --endpoint-url "$EP" \
            --size-only --no-progress --only-show-errors \
            --exclude "*" --include "*.thumb.webp" \
            --content-type image/webp \
            --cache-control "public, max-age=31536000, immutable"
          rm -rf dist/og
          echo "== dist size after OG offload =="; du -sh dist

      # When LLMS_FULL_BASE_URL is set, the 14 per-language whole-corpus dumps
      # (dist/**/llms-full.txt, ~301 MB) live on Cloudflare R2, not in the Pages
      # artifact. Sync them to the bucket under the _llms/ prefix (so the keys
      # mirror the paths the rewritten links point at — e.g. _llms/en/llms-full.txt),
      # then delete them from dist. Reuses the same R2 bucket + creds as the OG
      # offload. If the var is set but the R2 secrets are missing we FAIL — never
      # ship llms.txt links pointing at an empty bucket.
      - name: Offload llms-full.txt to R2
        if: ${{ vars.LLMS_FULL_BASE_URL != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::LLMS_FULL_BASE_URL is set but R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET are not all present. Refusing to ship llms.txt links that point at an unpopulated bucket."
            exit 1
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "== llms-full.txt dumps before offload =="; find dist -name llms-full.txt -printf '%s\t%p\n' | sort -rn || true
          # Mirror dist's llms-full.txt files to the bucket under _llms/ (keys keep
          # the <lang>/llms-full.txt layout). text/plain; modest TTL so a corrected
          # corpus can't stay stale at the edge for long.
          aws s3 sync dist "s3://${R2_BUCKET}/_llms/" --endpoint-url "$EP" \
            --size-only --no-progress --only-show-errors \
            --exclude "*" --include "llms-full.txt" --include "*/llms-full.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=3600"
          find dist -name llms-full.txt -delete
          echo "== dist size after llms-full offload =="; du -sh dist

      # When PAGEFIND_BASE_URL is set, the ~188 MB search index (dist/pagefind,
      # ≈27k .pf_fragment/.pf_index shards + meta + wasm + pagefind.js) lives on
      # Cloudflare R2, not in the Pages artifact. Pagefind's binaries are already
      # compressed, so they cost ~their full size in the single deflate-stream
      # artifact — offloading them is the biggest single lever after the OG cards.
      #
      # Unlike OG (<img>) and llms-full (navigations), the browser fetches these
      # shards cross-origin (fetch + a cross-origin dynamic import of pagefind.js),
      # so the bucket needs a GET/HEAD CORS policy for the site origin. We assert
      # one here (idempotent, best-effort — the object-scoped R2 token may lack
      # PutBucketCors; if so this warns and you set CORS once by hand/dashboard).
      #
      # Sync strategy: the shards, meta and wasm are content-hashed filenames, so
      # --size-only is correct and skips unchanged files (fast incremental). The
      # two fixed-name control files (pagefind.js, pagefind-entry.json — the latter
      # is the pointer to the current per-language index hashes) are re-uploaded
      # UNCONDITIONALLY so a changed pointer can never be skipped on a size match.
      # If the var is set but the R2 secrets are missing we FAIL — never ship a
      # /search page whose bundle URL points at an empty bucket.
      - name: Offload pagefind to R2
        if: ${{ vars.PAGEFIND_BASE_URL != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          # Origins allowed to fetch the search shards cross-origin.
          SITE_ORIGINS: '"https://negaraku.md","https://www.negaraku.md"'
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::PAGEFIND_BASE_URL is set but R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET are not all present. Refusing to ship a /search page whose bundle points at an unpopulated bucket."
            exit 1
          fi
          if [ ! -d dist/pagefind ]; then
            echo "::error::dist/pagefind does not exist — pagefind did not run in the build. Refusing to strip a non-existent index."
            exit 1
          fi
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "== pagefind before offload =="; du -sh dist/pagefind || true; find dist/pagefind -type f | wc -l

          # 1) Assert the GET/HEAD CORS policy (idempotent, best-effort).
          cat > /tmp/pf-cors.json <<JSON
          { "CORSRules": [ { "AllowedOrigins": [ ${SITE_ORIGINS} ], "AllowedMethods": ["GET","HEAD"], "AllowedHeaders": ["*"], "MaxAgeSeconds": 86400 } ] }
          JSON
          if aws s3api put-bucket-cors --bucket "$R2_BUCKET" --endpoint-url "$EP" --cors-configuration file:///tmp/pf-cors.json 2>/tmp/cors.err; then
            echo "CORS policy asserted on $R2_BUCKET for: ${SITE_ORIGINS}"
          else
            echo "::warning::Could not set the bucket CORS policy automatically (the R2 token may be object-scoped). Search will fail cross-origin until a GET/HEAD CORS policy for ${SITE_ORIGINS} is applied to the bucket by hand (Cloudflare dashboard → R2 → bucket → Settings → CORS, or aws s3api put-bucket-cors). Details: $(cat /tmp/cors.err)"
          fi

          # 2) Bulk content-hashed shards — --size-only is correct (changed content
          #    → new hash → new key), long-immutable cache. .pf_* read as bytes so
          #    content-type is cosmetic; wasm served as application/wasm.
          aws s3 sync dist/pagefind "s3://${R2_BUCKET}/_pagefind/" --endpoint-url "$EP" \
            --size-only --no-progress --only-show-errors \
            --exclude "*" --include "*.pf_meta" --include "*.pf_index" --include "*.pf_fragment" --include "*.pf_filter" \
            --content-type "application/octet-stream" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/pagefind "s3://${R2_BUCKET}/_pagefind/" --endpoint-url "$EP" \
            --size-only --no-progress --only-show-errors \
            --exclude "*" --include "*.wasm" \
            --content-type "application/wasm" \
            --cache-control "public, max-age=31536000, immutable"

          # 3) Fixed-name / loader files — re-upload UNCONDITIONALLY (cp, not sync)
          #    with a short TTL, so a changed pagefind-entry.json pointer is never
          #    skipped on a size match and a rebuilt index goes live within the hour.
          aws s3 cp dist/pagefind "s3://${R2_BUCKET}/_pagefind/" --recursive --endpoint-url "$EP" \
            --no-progress --only-show-errors \
            --exclude "*" --include "*.js" \
            --content-type "text/javascript; charset=utf-8" \
            --cache-control "public, max-age=3600"
          aws s3 cp dist/pagefind "s3://${R2_BUCKET}/_pagefind/" --recursive --endpoint-url "$EP" \
            --no-progress --only-show-errors \
            --exclude "*" --include "*.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=3600"
          aws s3 cp dist/pagefind "s3://${R2_BUCKET}/_pagefind/" --recursive --endpoint-url "$EP" \
            --no-progress --only-show-errors \
            --exclude "*" --include "*.css" \
            --content-type "text/css; charset=utf-8" \
            --cache-control "public, max-age=3600"

          rm -rf dist/pagefind
          echo "== dist size after pagefind offload =="; du -sh dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub Pages' server-side "syncing_files" step can exceed the action's
          # default 10-min client timeout on a large site (~17k pages), which aborts
          # an otherwise-healthy deploy. Give it 30 min of headroom.
          timeout: 1800000

      # Pages are now edge-cached by the analytics Worker (10-min TTL), so purge
      # Cloudflare's cache after each deploy to make the new build live at once
      # instead of waiting for the TTL. Soft-fails if the secrets aren't set, so
      # a missing token never blocks the deploy (pages still refresh within 10 min).
      # Needs CF_API_TOKEN with the "Cache Purge" permission + CF_ZONE_ID.
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "CF_API_TOKEN / CF_ZONE_ID not set — skipping purge (pages refresh within the 10-min edge TTL)."
            exit 0
          fi
          code=$(curl -s -o /tmp/purge.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Purge HTTP $code"; cat /tmp/purge.json
          if [ "$code" != "200" ]; then
            echo "::warning::Cloudflare cache purge failed (HTTP $code) — new build will still go live within the 10-min edge TTL."
          fi
