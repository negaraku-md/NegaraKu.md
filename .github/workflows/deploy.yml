name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The Visitors snapshot is committed by the accumulate workflow; a change to
    # it alone must not trigger a full site rebuild (it refreshes on the next
    # real deploy, which tops it up with the live tail).
    paths-ignore:
      - 'analytics/cumulative.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install fonts for Open Graph images
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-liberation

      - name: Content health check
        run: |
          npm run sync
          python3 scripts/health/scan.py --strict

      - name: Build (sync + graph + astro + pagefind)
        env:
          # Visitors analytics — build-analytics.mjs reads these to pull counts
          # from Analytics Engine. Absent → it no-ops ("not tracked yet").
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
