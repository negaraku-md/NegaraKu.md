name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Analytics snapshots are committed by their own scheduled workflows (the
    # Visitors accumulate + the Facebook/Search archive); a change to one alone
    # must not trigger a full site rebuild — each refreshes on the next real
    # deploy, which tops it up.
    paths-ignore:
      - 'analytics/**'
  workflow_dispatch:
    inputs:
      maintenance:
        description: 'Maintenance mode — show the maintenance screen on EVERY page. Turn off and re-run to restore the live site.'
        type: boolean
        default: false
      maintenance_until:
        description: 'Optional "expected back by" time, ISO (e.g. 2026-08-21T09:00). Blank = no time shown.'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Cache the CJK/Liberation .deb packages so the heavy fonts-noto-cjk
      # download (the thing that was timing this step out on slow apt mirrors)
      # happens ONCE, then restores instantly on every later run. Bump the key
      # suffix to force a refetch.
      - name: Cache OG system-font packages (.deb)
        uses: actions/cache@v5
        with:
          path: ~/og-fonts-deb
          key: og-fonts-deb-noto-cjk-liberation-tamil-v2

      - name: Install fonts for Open Graph images
        # BEST-EFFORT — OG social-card fonts must never block the site deploy
        # (continue-on-error + a hard 5-min bound; sharp renders the cards even
        # if a font is missing, it just degrades them). Two sources:
        #   • Brand fonts (Montserrat/Lato) are VENDORED in assets/og-fonts and
        #     registered straight into fontconfig — deterministic, zero network,
        #     and the OG cards now use real brand type instead of a fallback.
        #   • CJK + Liberation (system, for zh cards) install from the cached
        #     .deb if present (offline), else download once and populate the
        #     cache. A stalled mirror on the first run only degrades cards.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Brand fonts — offline, always available
          mkdir -p ~/.fonts
          cp assets/og-fonts/*.ttf ~/.fonts/
          # System CJK + Liberation — from cache if we have it, else fetch once
          mkdir -p ~/og-fonts-deb
          if ls ~/og-fonts-deb/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/og-fonts-deb/*.deb || sudo apt-get -f install -y --no-install-recommends || true
          else
            for i in 1 2 3; do
              sudo apt-get update && \
              sudo apt-get install -y --no-install-recommends --download-only fonts-noto-cjk fonts-liberation fonts-noto-core && break
              echo "apt attempt $i failed; retrying in 5s"; sleep 5
            done
            cp /var/cache/apt/archives/*.deb ~/og-fonts-deb/ 2>/dev/null || true
            sudo dpkg -i ~/og-fonts-deb/*.deb 2>/dev/null || sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-liberation fonts-noto-core || true
          fi
          fc-cache -f >/dev/null 2>&1 || true
          echo "== OG fonts visible to fontconfig =="
          fc-list | grep -iE "montserrat|lato|noto sans cjk|noto sans tamil|liberation" | sort | head -30 || true

      # Restore the per-article Open Graph PNGs so build-og only regenerates the
      # cards whose content actually changed (see scripts/build-og.mjs). The key
      # is bumped automatically when the renderer or logo changes, forcing a full
      # rebuild; otherwise the most recent cache is restored and topped up.
      - name: Cache Open Graph images
        uses: actions/cache@v5
        with:
          path: public/og
          key: og-${{ hashFiles('scripts/build-og.mjs', 'scripts/logo-flower.mjs') }}-${{ github.sha }}
          restore-keys: |
            og-${{ hashFiles('scripts/build-og.mjs', 'scripts/logo-flower.mjs') }}-

      - name: Content health check
        run: |
          npm run sync
          python3 scripts/health/scan.py --strict

      - name: Build (sync + graph + astro + pagefind)
        env:
          # Visitors analytics — build-analytics.mjs reads these to pull counts
          # from Analytics Engine. Absent → it no-ops ("not tracked yet").
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Maintenance mode — only ever on via a manual "Run workflow" with the
          # toggle. A normal push (inputs empty) always deploys the live site.
          MAINTENANCE: ${{ github.event.inputs.maintenance == 'true' && '1' || '' }}
          MAINTENANCE_UNTIL: ${{ github.event.inputs.maintenance_until }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
