name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The Visitors snapshot is committed by the accumulate workflow; a change to
    # it alone must not trigger a full site rebuild (it refreshes on the next
    # real deploy, which tops it up with the live tail).
    paths-ignore:
      - 'analytics/cumulative.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install fonts for Open Graph images
        # BEST-EFFORT — OG social-card fonts must never block the site deploy.
        # A stalled mirror once hung this step 16+ min; a broken one then failed
        # the whole build. Now: bounded (5 min), retried, and non-fatal. sharp
        # renders the cards without these fonts (CJK just falls back to whatever
        # is present) — it does not crash — so a bad apt only degrades the cards.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-liberation && \
            break
            echo "apt attempt $i failed; retrying in 5s"; sleep 5
          done

      # Restore the per-article Open Graph PNGs so build-og only regenerates the
      # cards whose content actually changed (see scripts/build-og.mjs). The key
      # is bumped automatically when the renderer or logo changes, forcing a full
      # rebuild; otherwise the most recent cache is restored and topped up.
      - name: Cache Open Graph images
        uses: actions/cache@v4
        with:
          path: public/og
          key: og-${{ hashFiles('scripts/build-og.mjs', 'scripts/logo-flower.mjs') }}-${{ github.sha }}
          restore-keys: |
            og-${{ hashFiles('scripts/build-og.mjs', 'scripts/logo-flower.mjs') }}-

      - name: Content health check
        run: |
          npm run sync
          python3 scripts/health/scan.py --strict

      - name: Build (sync + graph + astro + pagefind)
        env:
          # Visitors analytics — build-analytics.mjs reads these to pull counts
          # from Analytics Engine. Absent → it no-ops ("not tracked yet").
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
