name: Weekly maintenance digest

# Lifecycle steps 5 + re-translation, made proactive. Once a week this rebuilds
# the prioritized freshness queue (readership × how overdue) AND the re-translation
# worklist (masters updated since their translations), and keeps one living GitHub
# issue per concern in sync with them — so the work finds the maintainer instead of
# waiting to be noticed. Read-only over content: it generates data + edits issues,
# never the corpus. The on-page badges + the contributor Worklist cockpit are the
# other surfaces of the same facts.

on:
  schedule:
    - cron: '0 1 * * 1' # Mondays 01:00 UTC ≈ 09:00 MYT
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: review-due
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm ci

      # Regenerate the manifest + analytics the queues rank on, then build both.
      - name: Build the digests
        run: |
          node scripts/sync.mjs
          node scripts/build-analytics.mjs || true
          node scripts/translation-sync.mjs > /dev/null 2>&1 || true
          node scripts/build-review-queue.mjs > review-digest.md
          node scripts/build-translation-digest.mjs > translation-digest.md

      - name: Upsert the living maintenance issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upsert() { # <label> <color> <description> <title> <body-file>
            gh label create "$1" --color "$2" --description "$3" 2>/dev/null || true
            NUM=$(gh issue list --state open --label "$1" --limit 1 --json number --jq '.[0].number // empty')
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --title "$4" --body-file "$5"; echo "Updated #$NUM ($1)"
            else
              gh issue create --title "$4" --label "$1" --body-file "$5"; echo "Created ($1)"
            fi
          }
          upsert review-queue      FFC000 "Freshness queue — auto-maintained"        "📋 Articles due for review"   review-digest.md
          upsert translation-debt  1E90FF "Re-translation worklist — auto-maintained" "🌐 Translations to refresh"   translation-digest.md
