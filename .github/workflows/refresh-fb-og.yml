name: Refresh Facebook OG cards

# Forces Facebook to re-scrape the Open Graph card for already-posted articles
# whose cards were fixed (scripts/refresh-facebook-og.mjs). Targeted: only the
# AFFECTED posts — CJK (zh/ja/ko) summary-tofu + the 13 newly-localized
# subcategory breadcrumbs. Read-only (no posting, no manifest changes).
#
# RUN ORDER: deploy the corrected cards FIRST, then run this. Re-scraping before
# the fix is live just re-caches the broken card.
#
# Manual dispatch: first run with dry_run = true to preview the URL list; then
# run again with dry_run = false to actually refresh.
#
# TEMPORARY hourly schedule (added 2026-11-21): Facebook caps re-scrapes at
# ~66 URLs/run, so the 351 affected (zh/ja/ko tofu) posts need several spaced
# runs. This cron fires hourly (live — scheduled runs have no dry_run input) and
# self-expires via the guard step after the cutoff date. REMOVE this schedule
# block once the backlog is cleared.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list the URLs that WOULD be refreshed, call nothing.'
        type: boolean
        default: true
      limit:
        description: 'Cap the number of refreshes (blank = all affected).'
        required: false
  schedule:
    - cron: '23 * * * *' # hourly at :23 UTC — temporary; see the guard cutoff below

permissions:
  contents: read

concurrency:
  group: refresh-fb-og
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Self-expiry: scheduled runs stop after the cutoff so this temporary cron
      # does not keep burning minutes once the backlog is cleared. Manual
      # workflow_dispatch runs are never gated. Remove the schedule block then.
      - name: Guard (scheduled runs self-expire after cutoff)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ "$(date -u +%s)" -gt "$(date -u -d '2026-11-24 00:00:00' +%s)" ]; then
            echo "Past cutoff — the temporary auto-refresh window is closed; remove this schedule block."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v5

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Refresh Facebook OG cards
        if: steps.guard.outputs.run == 'true'
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: https://negaraku.md
          FB_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          REFRESH_LIMIT: ${{ github.event.inputs.limit }}
        run: node scripts/refresh-facebook-og.mjs
