name: Post backlog to LinkedIn

# Drains the published corpus to the NegaraKu.md LinkedIn Company Page as ARTICLE
# shares (clickable link cards), business/compliance pillar first, in English
# (scripts/post-backlog-to-linkedin.mjs, queue mode). Its own ranked queue +
# manifest (analytics/posted-linkedin.json) drain the backlog in priority order
# without double-posting, on a warm-up ramp (1/day for two weeks, then 3, then 5).
# Committing analytics/posted-linkedin.json does NOT trigger a deploy (deploy.yml
# ignores analytics/**).
#
# POSTING IS GATED on LinkedIn's Community Management API: the LINKEDIN_ACCESS_TOKEN
# secret (scope w_organization_social, minted for an org ADMIN) must be set. Until
# then the script runs in preview and posts nothing, so this is safe to run early.
#
# The daily `schedule:` is intentionally COMMENTED OUT until the token is in place
# and posting is approved to go live. Test now with a manual dispatch + dry_run.
on:
  # Uncomment to go live once LINKEDIN_ACCESS_TOKEN is set. LinkedIn engagement peaks
  # on weekday mornings, so two weekday ticks (09:17 & 11:17 MYT = 01:17 & 03:17 UTC);
  # the per-MYT-day guard means only the day's target posts and a skipped tick self-heals.
  # schedule:
  #   - cron: '17 1,3 * * 1-5'
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated knowledge/*.md paths (blank = next ranked queue batch)'
        required: false
      dry_run:
        description: 'Dry run — log what would be posted, do NOT call the LinkedIn API'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: linkedin-backlog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Post backlog to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          SITE_URL: https://negaraku.md
          # Empty "files" input → queue mode (post the next ranked batch).
          LINKEDIN_BACKLOG_QUEUE: '1'
          # Set only on cron runs → the once-per-MYT-day guard applies to scheduled
          # ticks, but a manual dispatch always posts (its full daily batch).
          LINKEDIN_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
          # Manual dispatch defaults to dry_run=true; a scheduled run is a real post.
          LINKEDIN_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/post-backlog-to-linkedin.mjs ${{ github.event.inputs.files }}

      - name: Commit the posted-manifest if it changed
        # always() so a post urn is committed even if the poster exits non-zero —
        # the manifest is the record of what's live and must never be lost.
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/posted-linkedin.json 2>/dev/null || true
          if git diff --cached --quiet -- analytics/posted-linkedin.json; then
            echo "manifest unchanged — nothing to commit"
          else
            git commit -m "chore(li): advance backlog posted-manifest [skip deploy]"
            git push
          fi
