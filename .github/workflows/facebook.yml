name: Post new articles to Facebook

on:
  push:
    branches: [main]
    paths:
      - 'knowledge/**/*.md'
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated knowledge/*.md paths to post (manual run)'
        required: false
      dry_run:
        description: 'Dry run — log what would be posted, do NOT call the Facebook API'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the poster can read each article's status at the
          # push's BEFORE commit (git show) to tell a debut from an edit — a
          # multi-commit push's BEFORE can be older than a shallow clone holds.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine candidate articles
        id: added
        run: |
          if [ -n "${{ github.event.inputs.files }}" ]; then
            FILES="${{ github.event.inputs.files }}"
            BEFORE=""
          else
            BEFORE='${{ github.event.before }}'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            fi
            # Added OR modified: publishing a reviewed draft edits an existing
            # file (status → published), so -A alone would miss it. The poster
            # reads status at BEFORE to post only the debut, never an edit.
            FILES="$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'knowledge/**/*.md' | tr '\n' ' ')"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "Candidates: $FILES"

      - name: Post to Facebook
        if: ${{ steps.added.outputs.files != '' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: https://negaraku.md
          # Baseline commit: lets the poster skip articles already published then
          # (an edit), so only a reviewed→published debut posts. Empty on manual
          # dispatch → the named published files post regardless.
          FB_BEFORE_SHA: ${{ steps.added.outputs.before }}
          # Manual "Run workflow" with the dry-run box ticked → log only, no API call.
          FB_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/post-to-facebook.mjs ${{ steps.added.outputs.files }}
