name: Post backlog to Facebook

# Drains the existing published corpus to the Facebook Pages as native OG-card
# photo posts with the link in the first comment (scripts/post-backlog-to-facebook.mjs,
# queue mode). The ranked queue + posted-manifest (analytics/posted.json) drain the
# backlog in priority order (GSC demand + pillar rotation) without double-posting,
# on a warm-up ramp (1/day for two weeks, then 3, then 5).
#
# The daily SCHEDULE IS LIVE — the automatic drip runs at 13:00 MYT each day
# (empty "files" = the next ranked batch). To pause the rollout, comment out the
# `schedule:` block below. Manual dispatch still works (tick dry_run to preview).
# Committing analytics/posted.json does NOT trigger a deploy (deploy.yml ignores
# analytics/**).
on:
    # TIMING COMES FROM CLOUDFLARE, NOT GITHUB. Each run posts at one of Malaysia's
    # engagement PEAKS — morning / lunch / evening (08:17 / 13:17 / 20:17 MYT). Each
    # language posts in its preferred window(s) (LANG_POLICY.windows) and DRIPS its
    # daily target across them. The window is passed in as client_payload.window and
    # read by the script as FB_WINDOW — so a run that starts a little late still posts
    # in the RIGHT window.
    #
    # The reliable trigger is the Cloudflare Worker cron (worker-fb-cron/), which fires
    # this repository_dispatch ON TIME. GitHub's OWN scheduled cron is UNRELIABLE for
    # our windows — it drops the 08:17 MYT tick and delays the 20:17 MYT tick 5-9h, so
    # posts were landing at 1-5am MYT. It is therefore DISABLED below; re-enable the
    # `schedule:` block only if the Worker trigger is ever unavailable (and expect drift).
  repository_dispatch:
    types: [fb-backlog]
  # schedule:
  #   - cron: '17 0,5,12 * * *' # DISABLED — unreliable; see worker-fb-cron/. Was 08:17/13:17/20:17 MYT.
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated knowledge/*.md paths (blank = next ranked queue batch)'
        required: false
      only_langs:
        description: 'Restrict to these languages, comma-separated (e.g. "ja"). Blank = all enabled.'
        required: false
      dry_run:
        description: 'Dry run — log what would be posted, do NOT call the Facebook API'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: facebook-backlog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Load the LATEST posted-manifest from the unprotected `fb-state` branch, not
      # from main. main is a protected branch, so the Actions bot cannot push the
      # advancing manifest back to it (GH006) — which previously froze the manifest
      # and made the poster re-post the same ranked batch every run. Runtime state
      # lives on fb-state instead; main's analytics/posted.json is only the seed the
      # first time fb-state doesn't exist yet.
      - name: Load posted-manifest from state branch
        run: |
          git fetch origin fb-state --depth=1 2>/dev/null || true
          if git cat-file -e origin/fb-state:posted.json 2>/dev/null; then
            git show origin/fb-state:posted.json > analytics/posted.json
            echo "loaded posted-manifest from fb-state"
          else
            echo "no fb-state branch yet — seeding from main's analytics/posted.json"
          fi

      - name: Post backlog to Facebook
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: https://negaraku.md
          # OG cards are served from Cloudflare R2 (og.negaraku.md); the photo URL
          # must point there, or the same-origin /og/* 404s and Facebook rejects
          # every post with code 324 "Missing or invalid image file".
          OG_BASE_URL: ${{ vars.OG_BASE_URL }}
          # Empty "files" input → queue mode (post the next ranked batch).
          FB_BACKLOG_QUEUE: '1'
          # Windowed (scheduled) behaviour on the Cloudflare-triggered repository_dispatch
          # (and the disabled GitHub schedule); a manual workflow_dispatch always posts.
          FB_SCHEDULED: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && '1' || '' }}
          # The window the Cloudflare Worker fired for (morning/lunch/evening) — trusted
          # over wall-clock so a slightly-late GitHub run still posts in the right window.
          FB_WINDOW: ${{ github.event.client_payload.window }}
          # Dry run from a manual dispatch input OR a repository_dispatch payload
          # (client_payload.dry_run) — lets the CF-trigger path be verified end-to-end
          # without posting to Facebook.
          FB_DRY_RUN: ${{ (github.event.inputs.dry_run == 'true' || github.event.client_payload.dry_run) && '1' || '' }}
          FB_ONLY_LANGS: ${{ github.event.inputs.only_langs }}
        run: node scripts/post-backlog-to-facebook.mjs ${{ github.event.inputs.files }}

      - name: Persist posted-manifest to state branch
        # always() so a post id is persisted even if the poster exits non-zero —
        # the manifest is the record of what's live and must never be lost.
        # Writes to the UNPROTECTED `fb-state` branch (single file posted.json) via
        # git plumbing — no worktree/branch switch, portable, and NOT subject to
        # main's branch protection. commit-tree + push <sha>:refs/heads/fb-state.
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        env:
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          [ -f analytics/posted.json ] || { echo "no manifest file — nothing to persist"; exit 0; }
          git fetch origin fb-state --depth=1 2>/dev/null || true
          blob=$(git hash-object -w analytics/posted.json)
          tree=$(printf '100644 blob %s\tposted.json\n' "$blob" | git mktree)
          parent=""
          if git rev-parse --verify --quiet origin/fb-state >/dev/null; then
            prevtree=$(git rev-parse "origin/fb-state^{tree}" 2>/dev/null || echo "")
            if [ "$tree" = "$prevtree" ]; then echo "manifest unchanged — nothing to persist"; exit 0; fi
            parent="-p origin/fb-state"
          fi
          commit=$(git commit-tree "$tree" $parent -m "chore(fb): advance posted-manifest [state]")
          git push origin "$commit:refs/heads/fb-state"
          echo "persisted posted-manifest to fb-state ($commit)"
