name: Post backlog to Facebook

# Drains the existing published corpus to the Facebook Pages as native OG-card
# photo posts with the link in the first comment (scripts/post-backlog-to-facebook.mjs,
# queue mode). The ranked queue + posted-manifest (analytics/posted.json) drain the
# backlog in priority order (GSC demand + pillar rotation) without double-posting,
# on a warm-up ramp (1/day for two weeks, then 3, then 5).
#
# The daily SCHEDULE IS LIVE — the automatic drip runs at 13:00 MYT each day
# (empty "files" = the next ranked batch). To pause the rollout, comment out the
# `schedule:` block below. Manual dispatch still works (tick dry_run to preview).
# Committing analytics/posted.json does NOT trigger a deploy (deploy.yml ignores
# analytics/**).
on:
    # TIMING COMES FROM CLOUDFLARE, NOT GITHUB. Each run posts at one of Malaysia's
    # engagement PEAKS — morning / lunch / evening (08:17 / 13:17 / 20:17 MYT). Each
    # language posts in its preferred window(s) (LANG_POLICY.windows) and DRIPS its
    # daily target across them. The window is passed in as client_payload.window and
    # read by the script as FB_WINDOW — so a run that starts a little late still posts
    # in the RIGHT window.
    #
    # The reliable trigger is the Cloudflare Worker cron (worker-fb-cron/), which fires
    # this repository_dispatch ON TIME. GitHub's OWN scheduled cron is UNRELIABLE for
    # our windows — it drops the 08:17 MYT tick and delays the 20:17 MYT tick 5-9h, so
    # posts were landing at 1-5am MYT. It is therefore DISABLED below; re-enable the
    # `schedule:` block only if the Worker trigger is ever unavailable (and expect drift).
  repository_dispatch:
    types: [fb-backlog]
  # schedule:
  #   - cron: '17 0,5,12 * * *' # DISABLED — unreliable; see worker-fb-cron/. Was 08:17/13:17/20:17 MYT.
  workflow_dispatch:
    inputs:
      files:
        description: 'Space-separated knowledge/*.md paths (blank = next ranked queue batch)'
        required: false
      only_langs:
        description: 'Restrict to these languages, comma-separated (e.g. "ja"). Blank = all enabled.'
        required: false
      dry_run:
        description: 'Dry run — log what would be posted, do NOT call the Facebook API'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: facebook-backlog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Post backlog to Facebook
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: https://negaraku.md
          # Empty "files" input → queue mode (post the next ranked batch).
          FB_BACKLOG_QUEUE: '1'
          # Windowed (scheduled) behaviour on the Cloudflare-triggered repository_dispatch
          # (and the disabled GitHub schedule); a manual workflow_dispatch always posts.
          FB_SCHEDULED: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && '1' || '' }}
          # The window the Cloudflare Worker fired for (morning/lunch/evening) — trusted
          # over wall-clock so a slightly-late GitHub run still posts in the right window.
          FB_WINDOW: ${{ github.event.client_payload.window }}
          FB_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          FB_ONLY_LANGS: ${{ github.event.inputs.only_langs }}
        run: node scripts/post-backlog-to-facebook.mjs ${{ github.event.inputs.files }}

      - name: Commit the posted-manifest if it changed
        # always() so a post id is committed even if the poster exits non-zero —
        # the manifest is the record of what's live and must never be lost.
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/posted.json 2>/dev/null || true
          if git diff --cached --quiet -- analytics/posted.json; then
            echo "manifest unchanged — nothing to commit"
          else
            git commit -m "chore(fb): advance backlog posted-manifest [skip deploy]"
            git push
          fi
