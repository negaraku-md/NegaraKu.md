name: Accumulate Visitors snapshot

# Folds the Analytics Engine tail into analytics/cumulative.json before AE's
# ~90-day retention drops it, so the site can show an all-time visitor count.
# Runs daily (well inside the retention window) and on demand. Commits the
# snapshot but does NOT trigger a site deploy — deploy.yml ignores that path;
# the live count refreshes on the next real deploy (build-analytics tops it up).

on:
  schedule:
    - cron: '0 3 * * *' # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      seed_series:
        description: 'One-time: backfill the daily trend series over AE last 90d (run once at launch)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: accumulate-analytics
  cancel-in-progress: false

jobs:
  accumulate:
    runs-on: ubuntu-latest
    steps:
      # Check out (and later push) with an admin PAT so the snapshot commit can
      # land on the PR-protected main branch — the default github-actions[bot] is
      # not an admin and classic branch protection can't add it to a bypass list.
      # Create a fine-grained PAT (Contents: Read & Write on this repo) owned by a
      # repo admin and store it as the WORKFLOW_PAT secret. Until it exists this
      # falls back to github.token (job stays red, as now) — no breakage.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The manifest lets the accumulator drop non-article / scanner traffic.
      - run: npm run sync

      - name: Fold AE tail into the snapshot
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # Use the broad CLOUDFLARE_API_TOKEN secret (proven to have Account
          # Analytics:Read). The narrow CF_API_TOKEN expired, which 401'd this job
          # and silently stopped folding the snapshot forward. TODO: refresh a
          # scoped Analytics:Read token into CF_API_TOKEN and revert this line.
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/accumulate-analytics.mjs ${{ github.event.inputs.seed_series == 'true' && '--seed-series' || '' }}

      - name: Commit the snapshot if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- analytics/cumulative.json; then
            git add analytics/cumulative.json
            git commit -m "chore(analytics): fold visitor snapshot forward [skip deploy]"
            git push
          else
            echo "snapshot unchanged — nothing to commit"
          fi
