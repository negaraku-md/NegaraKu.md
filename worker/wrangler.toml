# Cloudflare Worker — NegaraKu.md Visitors analytics edge logger.
# Deploy from this directory:  npx wrangler deploy
# See worker/README.md for the one-time setup (dataset, route, proxied DNS, token).

name = "negaraku-analytics"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false

# Live query endpoint (POST /_a/q, contributor-only — see query.js) reads the
# Analytics Engine SQL API. CF_ACCOUNT_ID is not secret (account id). The token
# is a SECRET — set it once, never commit it:
#   npx wrangler secret put AE_API_TOKEN     (Account Analytics:Read)
[vars]
CF_ACCOUNT_ID = "7137401369008b9b25b788ff1dbc14a2"

# Service binding to the auth Worker (negaraku-auth, route /api/auth/*). Required
# because a same-zone fetch to /api/auth/me is routed to the origin, not the
# Worker — the /_a/q gate calls env.AUTH.fetch() to verify the contributor cookie.
[[services]]
binding = "AUTH"
service = "negaraku-auth"

# Analytics Engine dataset the Worker writes each page view to.
# The name here must match CF_AE_DATASET used by scripts/build-analytics.mjs.
[[analytics_engine_datasets]]
binding = "AE"
dataset = "negaraku_analytics"

# Run on every request to the live site. REQUIRES the zone's DNS records to be
# PROXIED (orange cloud) — a DNS-only record never reaches the Worker.
[[routes]]
pattern = "negaraku.md/*"
zone_name = "negaraku.md"
