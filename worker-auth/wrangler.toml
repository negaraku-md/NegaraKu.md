# Cloudflare Worker — NegaraKu.md contributor auth (Sign in with GitHub).
# Deploy from this directory:  npx wrangler deploy
# See worker-auth/README.md for the one-time OAuth App + secrets setup.

name = "negaraku-auth"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false

[vars]
# Public OAuth App client id — safe to commit. Fill in after registering the app.
GITHUB_CLIENT_ID = ""
# Org whose membership marks a visitor as an "approved contributor".
ORG = "negaraku-md"
# Session cookie name.
COOKIE_NAME = "nk_session"

# Secrets (NEVER put these here — set with `wrangler secret put`):
#   GITHUB_CLIENT_SECRET   OAuth App client secret
#   SESSION_SIGNING_KEY    random 32+ bytes; signs the session cookie and state

# Handle only the auth paths. More specific than the analytics Worker's
# `negaraku.md/*`, so Cloudflare routes these here. REQUIRES proxied (orange) DNS.
[[routes]]
pattern = "negaraku.md/api/auth/*"
zone_name = "negaraku.md"
